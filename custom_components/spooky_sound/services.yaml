send_cue:
  fields:
    device_id:
      selector:
        device:
          multiple: true
          filter:
            - integration: spooky_sound
    cue:
      required: true
      default: thunder
      selector:
        select:
          translation_key: cue
          options:
            - thunder
            - rumble
            - fire
            - crackle
            - beat
            - peak
            - clear
    strength:
      default: 0.8
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    count:
      default: 6
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: slider
