name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # weekly, catches upstream HA / HACS / Arduino core changes

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Repository topics are set in GitHub's "About" box, not in the repo
          # itself. Remove this line once they're added (the HACS default list
          # requires them; custom-repository installs don't).
          ignore: topics

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  logic-tests:
    name: Integration logic + firmware sync tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  ha-tests:
    name: Integration in Home Assistant (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: python -m pytest -v

  firmware-host-tests:
    name: Firmware logic + DSP (host simulation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tools/hosttest/run.sh

  firmware-build:
    name: Firmware build (XIAO ESP32-C6, Zigbee router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/compile-sketches@v1
        with:
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          fqbn: esp32:esp32:XIAO_ESP32C6:CDCOnBoot=cdc,PartitionScheme=zigbee_zczr,ZigbeeMode=zczr
          sketch-paths: |
            - firmware/XIAO_SpookySound
          enable-warnings-report: true

  firmware-build-no-mic:
    name: Firmware build without the microphone (MIC_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the Espressif ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
      - name: Compile with MIC_ENABLED=0
        run: |
          arduino-cli compile --warnings default \
            --fqbn esp32:esp32:XIAO_ESP32C6:CDCOnBoot=cdc,PartitionScheme=zigbee_zczr,ZigbeeMode=zczr \
            --build-property "compiler.cpp.extra_flags=-DMIC_ENABLED=0" \
            firmware/XIAO_SpookySound

  esphome-build:
    name: ESPHome build (Gledopto GL-C-211WL, ${{ matrix.strip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strip: [rgbcct, rgbw, rgb]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install esphome==2026.10.0
      - name: Use this checkout's component, not main's
        run: sed -i 's#packages/components.yaml#packages/components-local.yaml#' esphome/spooky-overhead-${{ matrix.strip }}.yaml
      - run: esphome config esphome/spooky-overhead-${{ matrix.strip }}.yaml > /dev/null
      - run: esphome compile esphome/spooky-overhead-${{ matrix.strip }}.yaml
      - name: Fits WLED's app slot (for the OTA path from WLED)
        run: |
          ota=$(find esphome/.esphome/build -name 'firmware.ota.bin' | head -n1)
          [ -n "$ota" ] || ota=$(find esphome/.esphome/build -name 'firmware.bin' | head -n1)
          size=$(stat -c %s "$ota"); echo "$ota: $size bytes"
          test "$size" -lt 1572864 || { echo "::error::image $size bytes won't fit a 1.5 MB WLED app slot"; exit 1; }
          test "$size" -lt 1310720 || echo "::warning::image $size bytes is over 1.25 MB: OTA from WLED builds with the Arduino default partitions will fail"

